[package]
name = "nandi-protocol"
version = "0.1.0"
description = "The Nandi relay wire protocol: the messages and HTTP bodies a relay and its clients exchange"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
